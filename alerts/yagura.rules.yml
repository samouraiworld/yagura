# Example alert rules for yagura. Valid for Prometheus and VictoriaMetrics vmalert.
groups:
  - name: yagura
    rules:
      - alert: YaguraExporterDown
        # "yagura" is the example job name used in the README scrape configs.
        expr: up{job="yagura"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "yagura exporter {{ $labels.instance }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for 5 minutes."

      - alert: YaguraCollectorFailing
        expr: yagura_collector_up == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "yagura collector {{ $labels.collector }} is failing"
          description: "The last poll of collector {{ $labels.collector }} failed and has kept failing for 15 minutes. Check the exporter logs and the provider token."

      - alert: YaguraCollectorPartialFailure
        expr: yagura_collector_last_item_errors > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "yagura collector {{ $labels.collector }} skips items"
          description: "{{ $value }} item(s) failed or were skipped in the last successful poll of collector {{ $labels.collector }}."

      - alert: YaguraProviderIncident
        expr: yagura_statuspage_indicator >= 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Provider {{ $labels.provider }} reports a major incident"
          description: "The status page of {{ $labels.provider }} has reported a major or critical indicator for 5 minutes."
