# Example alert rules for yagura. Valid for Prometheus and VictoriaMetrics vmalert.
groups:
  - name: yagura
    rules:
      - alert: YaguraExporterDown
        # "yagura" is the example job name used in the README scrape configs.
        expr: up{job="yagura"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "yagura exporter {{ $labels.instance }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for 5 minutes."

      - alert: YaguraCollectorFailing
        expr: yagura_collector_up == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "yagura collector {{ $labels.collector }} is failing"
          description: "The last poll of collector {{ $labels.collector }} failed and has kept failing for 15 minutes. Check the exporter logs and the provider token."

      - alert: YaguraCollectorPartialFailure
        expr: yagura_collector_last_item_errors > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "yagura collector {{ $labels.collector }} skips items"
          description: "{{ $value }} item(s) failed or were skipped in the last successful poll of collector {{ $labels.collector }}."

      - alert: YaguraProviderIncident
        expr: yagura_statuspage_indicator >= 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Provider {{ $labels.provider }} reports a major incident"
          description: "The status page of {{ $labels.provider }} has reported a major or critical indicator for 5 minutes."

      - alert: YaguraDomainExpiringWithoutAutorenew
        # Both series come from the same exporter, so they match on all labels.
        # "unless ... == 1" also fires when the autorenew series is missing.
        expr: (yagura_gandi_domain_expiry_timestamp_seconds - time()) < 30 * 86400 unless yagura_gandi_domain_autorenew == 1
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Domain {{ $labels.domain }} expires soon and does not renew automatically"
          description: "Domain {{ $labels.domain }} has {{ $value | humanizeDuration }} left before its registration ends (negative once it has ended), and its autorenew is off or unknown. Renew it or turn autorenew on."

      - alert: YaguraGandiPrepaidBalanceLow
        expr: yagura_gandi_prepaid_balance < yagura_gandi_prepaid_warning_threshold
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Gandi prepaid balance is low ({{ $labels.currency }})"
          description: "The Gandi prepaid balance is {{ $value }} {{ $labels.currency }}, below the warning threshold set in the Gandi account."

      - alert: YaguraMonthlyCostOverBudget
        # 100 is an example monthly budget: edit it to yours. The amount is
        # month to date and resets on the 1st, so the alert resolves after
        # the first successful poll of the month (while polls fail, yagura
        # keeps the last value and YaguraCollectorFailing fires). Each
        # exporter instance, i.e. each organization, is compared on its own;
        # replicas of one exporter each raise the alert.
        # One threshold applies to every currency; add a currency matcher
        # (for example {currency="EUR"}) if the account bills in several.
        expr: sum without (project_id, project_name, category) (yagura_scaleway_consumption_amount) > 100
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Scaleway month-to-date cost is over budget ({{ $labels.currency }}, {{ $labels.instance }})"
          description: "Scaleway consumption since the 1st of the month is {{ printf \"%.2f\" $value }} {{ $labels.currency }}, above the budget set in this alert rule."
