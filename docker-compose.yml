services:
  yagura:
    image: ghcr.io/samouraiworld/yagura:latest
    build: .
    env_file: .env
    ports:
      - "10100:10100"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Example: pass a token as a Docker secret instead of an environment
    # variable. The program re-reads the file on every poll.
    #
    # The file is mounted with its host owner and mode, and the container
    # runs as UID 65532: make it readable by that user, for example with
    # `chmod 0444 secrets/gandi_token` or `sudo chown 65532 secrets/gandi_token`.
    # A 0600 file owned by your own account cannot be read. The secrets/
    # directory is ignored by git and left out of the Docker build context.
    #
    # environment:
    #   YAGURA_GANDI_TOKEN_FILE: /run/secrets/gandi_token
    # secrets:
    #   - gandi_token
    #
    # Top-level section:
    # secrets:
    #   gandi_token:
    #     file: ./secrets/gandi_token
    #
    # Example: budgets and the budget write API (both optional, see the
    # README). The state directory must survive upgrades and be writable by
    # UID 65532, for example a host directory prepared with
    # `mkdir -m 0700 state && sudo chown 65532:65532 state`; it is ignored by
    # git and left out of the Docker build context. Inside the container the
    # API listens on all interfaces so that Docker can forward to it; publish
    # it on 127.0.0.1 only and never route it from the Internet. Other
    # containers on the same Compose network can reach it too: keep services
    # you do not trust off yagura's network. The token file (random, at least
    # 32 characters, `openssl rand -hex 32`) gives write access: make it
    # readable by UID 65532 only, for example
    # `sudo chown root:65532 secrets/api_token && sudo chmod 0440 secrets/api_token`,
    # not world-readable.
    #
    # Add the API port to the `ports` list above:
    #   - "127.0.0.1:10101:10101"
    # volumes:
    #   - ./state:/var/lib/yagura
    # environment:
    #   YAGURA_STATE_DIR: /var/lib/yagura
    #   YAGURA_BUDGET_INITIAL_TOTAL: "100"
    #   YAGURA_BUDGET_INITIAL_SCALEWAY: "100"
    #   YAGURA_API_LISTEN_ADDRESS: ":10101"
    #   YAGURA_API_TOKEN_FILE: /run/secrets/api_token
    # secrets:
    #   - api_token
    #
    # Top-level section:
    # secrets:
    #   api_token:
    #     file: ./secrets/api_token
